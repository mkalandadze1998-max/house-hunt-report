name: Geocode listings

# Runs whenever the scraper publishes a new snapshot (and daily as a safety
# net). Fetches lat/lng for listings missing from geo.json via the myhome.ge
# statements API and publishes the result to the `geo-data` branch, which the
# site reads from raw.githubusercontent.com. Nothing is written to `main`, so
# the scraper's own pushes never conflict with this workflow.

on:
  push:
    branches: [main]
    paths:
      - data/properties.json
      - tools/geocode.mjs
      - .github/workflows/geocode.yml
  schedule:
    - cron: '30 3 * * *'   # 07:30 Tbilisi, after the nightly scrape
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geocode
  cancel-in-progress: false

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Seed with the previously published geo.json
        run: |
          mkdir -p out
          if git fetch --depth=1 origin geo-data 2>/dev/null; then
            git show origin/geo-data:data/geo.json > out/geo.json 2>/dev/null || true
          fi
          if [ ! -s out/geo.json ] && [ -s data/geo.json ]; then
            cp data/geo.json out/geo.json
          fi
          echo "seed entries: $(node -e 'try{const g=require("./out/geo.json");console.log(Object.keys(g.listings||{}).length)}catch{console.log(0)}')"

      - name: Fetch coordinates for new listings
        run: node tools/geocode.mjs --geo out/geo.json

      - name: Publish to the geo-data branch
        run: |
          set -e
          git config user.name  "house-hunt-bot"
          git config user.email "house-hunt-bot@users.noreply.github.com"
          git show origin/geo-data:data/geo.json > prev.json 2>/dev/null || echo '{}' > prev.json
          if node -e '
            const a=JSON.parse(require("fs").readFileSync("prev.json","utf8"));
            const b=JSON.parse(require("fs").readFileSync("out/geo.json","utf8"));
            process.exit(JSON.stringify(a.listings||{})===JSON.stringify(b.listings||{})?0:1)'; then
            echo "no changes"
          else
            git checkout --orphan geo-data
            git rm -rfq --cached . >/dev/null
            mkdir -p data
            cp out/geo.json data/geo.json
            git add -f data/geo.json
            git commit -qm "Update geo.json ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push --force origin geo-data
            echo "published"
          fi
