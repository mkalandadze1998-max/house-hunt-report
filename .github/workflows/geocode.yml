name: Collect ss.ge, geocode, track prices & alert

# Runs whenever the scraper publishes a new snapshot (and daily as a safety
# net). Two jobs in one:
#   1. collect  — long-term rentals from ss.ge and korter.ge in the target
#                 districts (ss.json, korter.json)
#   2. geocode  — lat/lng for myhome listings missing from geo.json
#   2b. commute — driving minutes from home per listing (commute.json, OSRM)
#   3. history  — append each listing's price to history.json when it changes
#   4. alerts   — Telegram message with new / reduced / gone listings
#                 (needs TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID repo secrets)
# All files are published to the `geo-data` branch, which the site reads from
# raw.githubusercontent.com.
#
# The myhome.ge scraper (mkalandadze1998-max/house-hunt) publishes only
# data/properties.json and data/properties.js to `main`; everything else on
# `main` is ours. Its push triggers this job, which also runs on a schedule
# and on repository_dispatch (event_type: snapshot-published).

on:
  push:
    branches: [main]
    paths:
      - data/properties.json
      - tools/geocode.mjs
      - tools/history.mjs
      - tools/collect-ss.mjs
      - tools/collect-korter.mjs
      - tools/commute.mjs
      - tools/alerts.mjs
      - data/alerts.json
      - .github/workflows/geocode.yml
  schedule:
    # 09:00, 14:00 and 19:30 Tbilisi (UTC+4): 30 min after each myhome.ge run. A scheduled run is
    # skipped when a push-triggered run already published within the last 40 minutes.
    - cron: '0 5 * * *'
    - cron: '0 10 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      hello:
        description: 'Send a test message to every configured Telegram chat'
        type: boolean
        default: false
  repository_dispatch:
    types: [snapshot-published]

permissions:
  contents: write

concurrency:
  group: geocode
  cancel-in-progress: false

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Skip a scheduled run that follows a fresh push-triggered run
        id: gate
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ] && git fetch --depth=1 origin geo-data 2>/dev/null; then
            last=$(git log -1 --format=%ct origin/geo-data 2>/dev/null || echo 0)
            age=$(( $(date +%s) - last ))
            echo "last geo-data publish was ${age}s ago"
            [ "$age" -lt 2400 ] && skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          [ "$skip" = true ] && echo "::notice::Skipping: data was published less than 40 minutes ago" || true

      - name: Seed with the previously published geo.json / history.json
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p out
          if git fetch --depth=1 origin geo-data 2>/dev/null; then
            git show origin/geo-data:data/geo.json     > out/geo.json     2>/dev/null || true
            git show origin/geo-data:data/history.json > out/history.json 2>/dev/null || true
            git show origin/geo-data:data/ss.json      > out/ss.json      2>/dev/null || true
            git show origin/geo-data:data/korter.json  > out/korter.json  2>/dev/null || true
            git show origin/geo-data:data/commute.json > out/commute.json 2>/dev/null || true
          fi
          [ -s out/geo.json ]     || { [ -s data/geo.json ]     && cp data/geo.json     out/geo.json;     } || true
          [ -s out/history.json ] || { [ -s data/history.json ] && cp data/history.json out/history.json; } || true
          cp out/history.json prev-hist.json 2>/dev/null || echo '{}' > prev-hist.json
          node -e 'for(const f of ["geo","history"]){try{const g=require("./out/"+f+".json");console.log(f,"seed entries:",Object.keys(g.listings||{}).length)}catch{console.log(f,"seed entries: 0")}}'

      - name: Collect ss.ge listings
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        run: node tools/collect-ss.mjs --out out/ss.json

      - name: Collect korter.ge listings
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        run: node tools/collect-korter.mjs --out out/korter.json

      - name: Fetch coordinates for new listings
        if: steps.gate.outputs.skip != 'true'
        run: node tools/geocode.mjs --geo out/geo.json

      - name: List extra sources
        if: steps.gate.outputs.skip != 'true'
        run: |
          EXTRA=""
          for f in out/ss.json out/korter.json; do [ -s "$f" ] && EXTRA="$EXTRA --extra $f"; done
          echo "EXTRA=$EXTRA" >> $GITHUB_ENV
          echo "extra sources:$EXTRA"

      - name: Driving time from home (OSRM)
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        run: node tools/commute.mjs --commute out/commute.json --geo out/geo.json $EXTRA

      - name: Record prices from this snapshot
        if: steps.gate.outputs.skip != 'true'
        run: node tools/history.mjs --history out/history.json $EXTRA

      - name: Telegram test message
        if: github.event.inputs.hello == 'true' && steps.gate.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node tools/alerts.mjs --hello

      - name: Telegram alerts
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HH_PASSWORD: ${{ secrets.HH_PASSWORD }}
        run: node tools/alerts.mjs --history out/history.json --prev prev-hist.json --geo out/geo.json $EXTRA

      - name: Publish to the geo-data branch
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -e
          git config user.name  "house-hunt-bot"
          git config user.email "house-hunt-bot@users.noreply.github.com"
          git show origin/geo-data:data/geo.json     > prev-geo.json  2>/dev/null || echo '{}' > prev-geo.json
          git show origin/geo-data:data/history.json > prev-hist.json 2>/dev/null || echo '{}' > prev-hist.json
          git show origin/geo-data:data/ss.json      > prev-ss.json   2>/dev/null || echo '{}' > prev-ss.json
          git show origin/geo-data:data/korter.json  > prev-korter.json 2>/dev/null || echo '{}' > prev-korter.json
          git show origin/geo-data:data/commute.json > prev-commute.json 2>/dev/null || echo '{}' > prev-commute.json
          [ -s out/ss.json ] || cp prev-ss.json out/ss.json
          [ -s out/korter.json ] || cp prev-korter.json out/korter.json
          [ -s out/commute.json ] || cp prev-commute.json out/commute.json
          if node -e '
            const fs=require("fs");const r=(f,k)=>JSON.parse(fs.readFileSync(f,"utf8"))[k]||{};
            const same=(a,b,k)=>JSON.stringify(r(a,k))===JSON.stringify(r(b,k));
            process.exit(same("prev-geo.json","out/geo.json","listings")&&same("prev-hist.json","out/history.json","listings")&&same("prev-ss.json","out/ss.json","properties")&&same("prev-korter.json","out/korter.json","properties")&&same("prev-commute.json","out/commute.json","listings")?0:1)'; then
            echo "no changes"
          else
            git checkout --orphan geo-data
            git rm -rfq --cached . >/dev/null
            mkdir -p data
            cp out/geo.json data/geo.json
            cp out/history.json data/history.json
            cp out/ss.json data/ss.json
            cp out/korter.json data/korter.json
            cp out/commute.json data/commute.json
            git add -f data/geo.json data/history.json data/ss.json data/korter.json data/commute.json
            git commit -qm "Update ss/korter/geo/commute/history ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push --force origin geo-data
            echo "published"
          fi
